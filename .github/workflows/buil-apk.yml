name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Montar projeto Android
        run: python3 make_project.py

      - name: Preparar Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Compilar APK
        run: gradle -p android assembleRelease --no-daemon

      - name: Conferir permissoes (deve estar vazio)
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump permissions "$APK" || true

      - uses: actions/upload-artifact@v4
        with:
          name: BrainWorkshop-APK
          path: android/app/build/outputs/apk/release/*.apk
